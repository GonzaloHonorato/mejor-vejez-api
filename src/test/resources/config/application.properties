# Solo para pruebas. Vive en classpath:/config/ (y no en classpath:/) para
# SUMARSE al application.properties de main en vez de taparlo: Spring Boot
# carga ambas ubicaciones y la de /config/ tiene precedencia.
# Sin disparo programado del generador de tareas en ningún contexto de
# prueba: si la suite corriera a las 00:05 de Santiago, una corrida global
# con el reloj fijo de la prueba se cruzaría con las pruebas del generador.
mejorvejez.procesos.habilitados=false

# Ronda de corrección 1/2 (Fase 6, Tarea 1): la causa real de ORA-03113/
# ORA-12541 no era memoria ni cantidad de conexiones: era que el contenedor
# Oracle compartido se exponía como @Bean, y al expulsar un contexto de la
# caché de Spring Test, el TestcontainersLifecycleBeanPostProcessor lo
# detenía (ver ConfiguracionTestcontainers). Esa causa ya se corrigió ahí
# (DynamicPropertyRegistrar, sin bean del contenedor). Este pool más chico
# por contexto se conserva solo para bajar la cantidad de sesiones Oracle
# simultáneas entre los contextos que sí quedan en caché.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
