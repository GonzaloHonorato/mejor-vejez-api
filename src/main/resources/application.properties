spring.application.name=mejor-vejez-api
app.version=@project.version@
server.port=${SERVER_PORT:8080}

# ── Oracle (Autonomous DB con wallet) ───────────────────────────────────────
# El wallet se descomprime en ORACLE_WALLET_DIR. En el contenedor lo hace
# entrypoint.sh desde ORACLE_WALLET_BASE64; en local, descomprímelo en ./wallet.
# ORACLE_TNS_ALIAS es un alias de tnsnames.ora del wallet (p. ej. midb_high).
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_TNS_ALIAS:}?TNS_ADMIN=${ORACLE_WALLET_DIR:./wallet}
spring.datasource.username=${ORACLE_USERNAME:}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# 5 s y no los 30 por defecto: /api/salud no debe colgarse si la BD no responde.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# El esquema lo crea Flyway (src/main/resources/db/migration); Hibernate solo
# lo valida. Flyway corre al arrancar, así que la app exige la BD para levantar.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
# Dialecto fijo: Hibernate no lo detecta consultando a Oracle.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.sql.init.mode=never
# NO fijar hibernate.jdbc.time_zone: DETALLE_PLAN_HORARIO.HORA_ADMINISTRACION
# (planificacion.DetallePlan) guarda la hora de reloj America/Santiago como
# LocalDateTime literal (fecha fija 1970-01-01, sin conversión de zona); si se
# fija esta propiedad, Hibernate desplaza esa hora al escribir/leer y rompe el
# CHECK CK_PLAN_HORARIO_SOLO_HORA (exige TRUNC(...) = 1970-01-01).

# ── Firebase Auth ───────────────────────────────────────────────────────────
# Se valida el ID token de Firebase como JWT: firma con las llaves públicas de
# Google, emisor y audiencia del proyecto. No requiere cuenta de servicio.
app.firebase.project-id=${FIREBASE_PROJECT_ID:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/${app.firebase.project-id}
spring.security.oauth2.resourceserver.jwt.audiences=${app.firebase.project-id}

# ── CORS ────────────────────────────────────────────────────────────────────
# Orígenes separados por coma.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ── Procesos programados (Fase 4) ───────────────────────────────────────────
# Generador diario de tareas de medicamentos (HU-05): ventana de N días desde
# las 00:00 de hoy (America/Santiago) y cron en esa zona (00:05 por defecto).
# PROCESOS_HABILITADOS=false apaga el disparo programado (la corrida manual
# del administrador sigue disponible).
mejorvejez.tareas.dias-ventana=${TAREAS_DIAS_VENTANA:7}
mejorvejez.tareas.cron-generacion=${TAREAS_CRON_GENERACION:0 5 0 * * *}
mejorvejez.procesos.habilitados=${PROCESOS_HABILITADOS:true}

# ── Alertas y notificaciones (Fase 5) ───────────────────────────────────────
# Ventana retrospectiva de la detección de atrasos (regla 2) y de "notificar
# pendientes" (regla 10): evita que al desplegar por primera vez lluevan
# alertas/correos de tareas viejas.
mejorvejez.alertas.horas-retrospectiva=${ALERTAS_HORAS_RETROSPECTIVA:48}
# Cron (America/Santiago) de los dos procesos programados de alertas (regla
# 12). PROCESOS_HABILITADOS=false los apaga igual que el generador de tareas.
mejorvejez.alertas.cron-deteccion=${ALERTAS_CRON_DETECCION:0 */5 * * * *}
mejorvejez.alertas.cron-preventivas=${ALERTAS_CRON_PREVENTIVAS:0 10 * * * *}
# Máximo de intentos de envío por par (destinatario, canal) de una alerta (regla 9).
mejorvejez.notificaciones.max-intentos=${NOTIFICACIONES_MAX_INTENTOS:3}
# Spike de WhatsApp (TSA-46, regla 15): fijo, NO se lee de una variable de
# entorno. Fuera del MVP mientras torcaza no confirme el canal.
mejorvejez.notificaciones.whatsapp-habilitado=false
# Remitente y URL del front que arma el cuerpo del correo (regla 6/16). Si
# MAIL_HOST o este remitente están vacíos, el intento de correo queda
# FALLIDO con un detalle de error (TSA-45), sin tumbar el arranque.
mejorvejez.notificaciones.remitente=${MAIL_REMITENTE:}
mejorvejez.notificaciones.url-app=${APP_URL:http://localhost:4200}

# ── Correo (Fase 5, regla 16) ───────────────────────────────────────────────
# Local: Mailpit (docker-compose.local.yml), SMTP sin auth/TLS. Producción:
# SMTP real, lo configura Gonzalo en el despliegue.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
# Timeouts SMTP en ms (conexión, lectura y escritura). JavaMail los deja
# infinitos por defecto: un servidor que acepta la conexión y no responde
# colgaría el hilo único del planificador con la alerta bloqueada. Con el
# límite, el envío termina como un intento FALLIDO normal.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:10000}
